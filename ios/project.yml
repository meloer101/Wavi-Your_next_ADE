# The iPhone app of F22 (PRD v1.119): SwiftUI, iOS 26. `xcodegen` in this folder writes Wavi.xcodeproj (git-ignored).
name: Wavi
options:
  bundleIdPrefix: app.wavi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # Chinese is the language the app is written in: the keys of Resources/Localizable.xcstrings are the Chinese strings
  # of the code, with English beside them. The phone follows iOS's language for the app (Settings › Wavi › Language).
  developmentLanguage: zh-Hans
settings:
  base:
    DEVELOPMENT_TEAM: U9XR52C9HW
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The compiler lists the code's localizable strings, so Xcode keeps the String Catalogs in step with the code.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  Ristretto255:
    path: Packages/Ristretto255
  # An agent's reply is GFM (PRD F22 v1.230): CommonMark + tables, task lists and strikethrough, from cmark-gfm.
  # Apache-2.0, attributed in THIRD_PARTY_NOTICES.md. Drawn by ios/Wavi/Views/Markdown.swift, not by the library.
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: 0.9.0
targets:
  Wavi:
    type: application
    platform: iOS
    sources:
      - path: Wavi
      - path: LiveActivity
    dependencies:
      - package: Ristretto255
        product: CRistretto255
      - package: swift-markdown
        product: Markdown
      - target: WaviActivity
    info:
      path: Wavi/Info.plist
      properties:
        CFBundleDisplayName: Wavi
        # Both, so iOS offers the per-app Language row; the usage descriptions below are translated in
        # Wavi/App/<lang>.lproj/InfoPlist.strings. A phone in neither language gets English (the development region),
        # although the catalog's source language is Chinese.
        CFBundleLocalizations: [zh-Hans, en]
        CFBundleDevelopmentRegion: en
        CFBundleURLTypes:
          - CFBundleURLName: app.wavi.remote
            CFBundleURLSchemes: [wavi]
        NSCameraUsageDescription: 扫描 Mac 上的配对二维码，拍照发给智能体。
        NSLocalNetworkUsageDescription: 连接同一个 Wi-Fi 里的 Mac 上的 Wavi。
        # Frames carry their own AES-256-GCM (PRD §6.16); ws:// to a Tailscale or LAN address is not what ATS protects.
        # NSAllowsArbitraryLoads alone: with NSAllowsLocalNetworking next to it iOS ignores it, and ws:// to Tailscale's
        # 100.64.0.0/10 (not a local network to iOS) is refused (measured on an iPhone 17, iOS 27.0.1, 2026-11-01).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIAppFonts: [JetBrainsMono_400Regular.ttf, JetBrainsMono_500Medium.ttf]
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        # 看板 · 进度 turns sideways (PRD F22 v1.229 ②, Figma 103′C); the app itself keeps every other screen portrait
        # (`Orientation`, App/Orientation.swift), so both landscape entries are needed here for that one screen.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wavi.remote
        TARGETED_DEVICE_FAMILY: "1"
        # LiveActivity/ActivityIntents.swift answers only in the app's process.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WAVI_APP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # The Live Activity (PRD F22 S2, Figma 47): the Dynamic Island and the Lock Screen. It draws what the app hands it;
  # its buttons are LiveActivityIntents the system runs in the app's process.
  WaviActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: WaviActivity
      - path: LiveActivity
      - path: Wavi/Views/Theme.swift
      - path: Wavi/Views/Glyphs.swift
      - path: Wavi/Model/Shared.swift
      - path: Wavi/Model/Wire.swift
      - path: Wavi/Net/JSONValue.swift
      - path: Wavi/Resources
        buildPhase: resources
      - path: Wavi/Assets.xcassets
    info:
      path: WaviActivity/Info.plist
      properties:
        CFBundleDisplayName: Wavi
        CFBundleLocalizations: [zh-Hans, en]
        CFBundleDevelopmentRegion: en
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts: [JetBrainsMono_400Regular.ttf, JetBrainsMono_500Medium.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wavi.remote.activity
        TARGETED_DEVICE_FAMILY: "1"
  WaviTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WaviTests
      - path: ../src/shared/remote-vectors.json
        buildPhase: resources
      - path: ../src/shared/remote-wire-samples.json
        buildPhase: resources
    dependencies:
      - target: Wavi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wavi.remote.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Wavi:
    build:
      targets:
        Wavi: all
        WaviTests: [test]
    test:
      targets: [WaviTests]
      # The tests read the Chinese strings; LocalizationTests reads the English table on its own.
      language: zh-Hans
      region: CN
